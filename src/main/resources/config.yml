# DillyyXmas config. Rewards are console commands; %player% is replaced with the player's name.
prefix: "&c&l❄ &a&lXmas &c&l» &r"
timezone: "America/Chicago"      # used for the advent calendar dates

advent:
  title: "&c&lAdvent Calendar"
  test-mode: false               # true = every door can be opened right now (for testing)
  late-claim: true               # true = missed days can still be claimed later in December
  join-reminder: true
  timezone-lock: true            # players can pick their timezone once (stops claiming days early); staff can change it with /xmas timezone
  # To give crate keys use your plugin's key command (check /crate usage in-game), then add it as a line here.
  days:
    1:
      display: "&a$250,000"
      commands:
        - "addmoney %player% 250000"
    2:
      display: "&e20 Shards"
      commands:
        - "addshards %player% 20"
    3:
      display: "&a$750,000"
      commands:
        - "addmoney %player% 750000"
    4:
      display: "&e40 Shards"
      commands:
        - "addshards %player% 40"
    5:
      display: "&d$2,500,000 + 100 Shards"
      commands:
        - "addmoney %player% 2500000"
        - "addshards %player% 100"
    6:
      display: "&e60 Shards"
      commands:
        - "addshards %player% 60"
    7:
      display: "&a$1,750,000"
      commands:
        - "addmoney %player% 1750000"
    8:
      display: "&e80 Shards"
      commands:
        - "addshards %player% 80"
    9:
      display: "&a$2,250,000"
      commands:
        - "addmoney %player% 2250000"
    10:
      display: "&d$5,000,000 + 200 Shards"
      commands:
        - "addmoney %player% 5000000"
        - "addshards %player% 200"
    11:
      display: "&a$2,750,000"
